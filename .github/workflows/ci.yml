name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --all-groups --frozen
      - run: uv run pytest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --check apps/extension/src/content.js
      - run: node --check apps/extension/src/service-worker.js
